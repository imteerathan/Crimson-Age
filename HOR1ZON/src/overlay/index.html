<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self';style-src 'self' 'unsafe-inline';script-src 'self'">
<title>HOR1ZON Overlay</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;font-family:"Segoe UI",Arial,sans-serif;color:#edf2f7}
body{pointer-events:none}
#panel{position:absolute;top:18px;right:18px;min-width:300px;max-width:430px;padding:12px 14px;border:1px solid rgba(170,190,210,.22);border-radius:12px;background:rgba(10,14,19,.78);backdrop-filter:blur(10px);box-shadow:0 10px 32px rgba(0,0,0,.3);opacity:.92;transform-origin:top right}
#brand{font-size:11px;letter-spacing:.18em;font-weight:800;color:#c8d5e2;margin-bottom:7px}
#title{font-size:15px;font-weight:700}
#meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;color:#aab6c3;font-size:11px}
#message{margin-top:7px;font-size:12px;color:#d6dee7}
#hint{margin-top:8px;color:#718092;font-size:10px}
.compact #panel{min-width:220px;padding:9px 11px}.compact #meta{display:none}.compact #hint{display:none}
.focus #panel{top:50%;right:50%;transform:translate(50%,-50%);min-width:360px;text-align:center}
.focus #meta{justify-content:center}
</style>
</head>
<body>
<div id="panel">
  <div id="brand">HOR1ZON OVERLAY</div>
  <div id="title">Ready</div>
  <div id="meta"></div>
  <div id="message">Standalone overlay test surface</div>
  <div id="hint">Ctrl + Shift + H · Toggle overlay</div>
</div>
<script src="overlay.js"></script>
</body>
</html>

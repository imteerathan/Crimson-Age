<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self';style-src 'self' 'unsafe-inline';script-src 'self'">
  <title>Crimson Age Desktop</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div>
      <b>CRIMSON AGE</b>
      <span>Desktop · Local Field Test</span>
    </div>
    <div class="header-actions">
      <span id="app-version" class="app-version">v—</span>
      <button id="update">Check for Updates</button>
      <button id="dev">Developer</button>
    </div>
  </header>

  <main>
    <aside>
      <button data-view="home">Dashboard</button>
      <button data-view="playbook">Playbook</button>
      <button data-view="map">Map</button>
      <button data-view="checklist">Checklist</button>
      <button data-view="save">Save Analyzer</button>
      <button data-view="data">Local Database</button>
    </aside>
    <section id="app"></section>
  </main>

  <script src="app.js"></script>
</body>
</html>

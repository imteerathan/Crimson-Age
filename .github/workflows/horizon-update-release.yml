name: HOR1ZON Update Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Horizon version to release"
        required: true
        type: string
      channel:
        description: "Update channel"
        required: true
        default: stable
        type: choice
        options:
          - stable
          - beta
  push:
    paths:
      - 'updates/PUBLISH-*'

permissions:
  contents: write

concurrency:
  group: horizon-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: HOR1ZON
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: HOR1ZON/package.json

      - name: Resolve release inputs
        id: release
        shell: powershell
        run: |
          if ("${{ inputs.version }}" -ne "") {
            $version = "${{ inputs.version }}"
            $channel = "${{ inputs.channel }}"
          } else {
            $marker = Get-ChildItem ../updates/PUBLISH-* | Sort-Object Name | Select-Object -Last 1
            if ($null -eq $marker) { throw "No Horizon publish marker found." }
            $version = $marker.Name -replace '^PUBLISH-', ''
            $channel = 'stable'
          }
          if ($version -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') { throw "Invalid SemVer: $version" }
          "version=$version" >> $env:GITHUB_OUTPUT
          "channel=$channel" >> $env:GITHUB_OUTPUT

      - name: Install dependencies
        run: npm install

      - name: Set release version
        shell: powershell
        run: npm pkg set version="${{ steps.release.outputs.version }}"

      - name: Syntax check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Resolve release artifact
        shell: powershell
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          $version = "${{ steps.release.outputs.version }}"
          $exe = "dist/Crimson-Atlas-Horizon-Setup-$version.exe"
          $tag = "horizon-v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release download $tag --repo $env:GITHUB_REPOSITORY --pattern "Crimson-Atlas-Horizon-Setup-$version.exe" --dir dist --clobber
          } else {
            npm run build:win
            if (!(Test-Path $exe)) { throw "Missing release artifact: $exe" }
            gh release create $tag $exe --repo $env:GITHUB_REPOSITORY --title "Crimson Atlas Horizon v$version" --notes "Horizon Extension $version"
          }
          if (!(Test-Path $exe)) { throw "Missing release artifact: $exe" }

      - name: Prepare update metadata
        shell: powershell
        run: |
          $version = "${{ steps.release.outputs.version }}"
          $channel = "${{ steps.release.outputs.channel }}"
          New-Item -ItemType Directory -Force -Path "../updates/$channel" | Out-Null
          $exe = "dist/Crimson-Atlas-Horizon-Setup-$version.exe"
          if (!(Test-Path $exe)) { throw "Missing release artifact: $exe" }

          $meta = node -e "const fs=require('fs'),crypto=require('crypto');const f=process.argv[1];const h=crypto.createHash('sha512').update(fs.readFileSync(f)).digest('base64');const s=fs.statSync(f).size;console.log(JSON.stringify({sha512:h,size:s}))" $exe | ConvertFrom-Json
          $assetUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/horizon-v$version/Crimson-Atlas-Horizon-Setup-$version.exe"
          $releaseDate = (Get-Date).ToUniversalTime().ToString("o")
          @"
          version: $version
          files:
            - url: $assetUrl
              sha512: $($meta.sha512)
              size: $($meta.size)
          releaseDate: $releaseDate
          "@ | Set-Content -Path "../updates/$channel/latest.yml" -Encoding UTF8

      - name: Publish update feed metadata
        shell: powershell
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          $version = "${{ steps.release.outputs.version }}"
          $channel = "${{ steps.release.outputs.channel }}"
          $path = "updates/$channel/latest.yml"
          $repo = $env:GITHUB_REPOSITORY
          $local = "../updates/$channel/latest.yml"
          $content = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes((Get-Content $local -Raw)))
          gh api --method PUT "repos/$repo/contents/$path" -f "message=chore(horizon): publish $channel feed v$version" -f "content=$content" -f "branch=$env:GITHUB_REF_NAME"

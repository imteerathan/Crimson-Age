name: Windows Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Read version metadata
        id: version
        shell: bash
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "public=$(node -p "require('./versioning.json').publicVersion")" >> "$GITHUB_OUTPUT"

      - name: Validate version metadata
        shell: bash
        run: |
          node -e "const v=require('./versioning.json'); if (!/^\d+\.\d+\.\d+(\.\d+)?$/.test(v.publicVersion)) throw new Error('Invalid publicVersion'); if (!/^\d+\.\d+\.\d+$/.test(v.updaterVersion)) throw new Error('Invalid updaterVersion'); if (v.releaseType==='hotfix' && (!v.baseVersion || !Number.isInteger(v.hotfixNumber) || v.hotfixNumber < 1)) throw new Error('Invalid hotfix metadata'); console.log(v);"

      - name: Check whether release already exists
        id: release_check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists. Skipping publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Windows packages
        if: steps.release_check.outputs.exists != 'true'
        run: npm run build -- --publish never

      - name: Generate updater metadata
        if: steps.release_check.outputs.exists != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/generate-latest-yml.js
      - name: Verify updater artifacts
        if: steps.release_check.outputs.exists != 'true'
        shell: powershell
        run: |
          $version = node -p "require('./package.json').version"
          $required = @(
            "dist/latest.yml",
            "dist/Crimson-Age-Setup-$version.exe",
            "dist/Crimson-Age-Setup-$version.exe.blockmap"
          )
          foreach ($path in $required) {
            if (!(Test-Path $path)) { throw "Missing updater artifact: $path" }
          }
          Write-Host "Updater artifacts verified:"
          Get-ChildItem dist | Select-Object Name,Length

      - name: Create GitHub release and upload artifacts
        if: steps.release_check.outputs.exists != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          gh release create "$TAG"             "dist/latest.yml"             "dist/Crimson-Age-Setup-${{ steps.version.outputs.version }}.exe"             "dist/Crimson-Age-Setup-${{ steps.version.outputs.version }}.exe.blockmap"             --repo "$GITHUB_REPOSITORY"             --title "Crimson Age v${{ steps.version.outputs.public }}"             --generate-notes

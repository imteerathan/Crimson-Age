name: Windows Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Read package version
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check whether release already exists
        id: release_check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists. Skipping publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Windows packages
        if: steps.release_check.outputs.exists != 'true'
        run: npm run build -- --publish never

      - name: Generate updater metadata
        if: steps.release_check.outputs.exists != 'true'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          test -f "dist/Crimson-Age-Setup-$VERSION.exe"
          node -e "const fs=require('fs'); const crypto=require('crypto'); const version=process.env.VERSION; const exe='dist/Crimson-Age-Setup-'+version+'.exe'; const buf=fs.readFileSync(exe); const sha512=crypto.createHash('sha512').update(buf).digest('base64'); const size=fs.statSync(exe).size; const releaseDate=new Date().toISOString(); const yml=['version: '+version,'files:','  - url: Crimson-Age-Setup-'+version+'.exe','    sha512: '+sha512,'    size: '+size,'path: Crimson-Age-Setup-'+version+'.exe','sha512: '+sha512,'releaseDate: '+releaseDate,''].join('\n'); fs.writeFileSync('dist/latest.yml',yml,'utf8'); console.log(yml);"

      - name: Verify updater artifacts
        if: steps.release_check.outputs.exists != 'true'
        shell: powershell
        run: |
          $version = node -p "require('./package.json').version"
          $required = @(
            "dist/latest.yml",
            "dist/Crimson-Age-Setup-$version.exe",
            "dist/Crimson-Age-Setup-$version.exe.blockmap"
          )
          foreach ($path in $required) {
            if (!(Test-Path $path)) { throw "Missing updater artifact: $path" }
          }
          Write-Host "Updater artifacts verified:"
          Get-ChildItem dist | Select-Object Name,Length

      - name: Create GitHub release and upload artifacts
        if: steps.release_check.outputs.exists != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          gh release create "$TAG"             "dist/latest.yml"             "dist/Crimson-Age-Setup-${{ steps.version.outputs.version }}.exe"             "dist/Crimson-Age-Setup-${{ steps.version.outputs.version }}.exe.blockmap"             --repo "$GITHUB_REPOSITORY"             --title "Crimson Age $TAG"             --generate-notes

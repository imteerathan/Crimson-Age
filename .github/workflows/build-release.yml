name: Build and Release Horizon

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build Windows installers
        run: npm run build

      - name: Read package version
        id: version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Crimson Atlas Horizon v${{ steps.version.outputs.version }}
          generate_release_notes: true
          make_latest: true
          files: |
            dist/Crimson-Atlas-Horizon-Setup-${{ steps.version.outputs.version }}.exe
            dist/Crimson-Atlas-Horizon-${{ steps.version.outputs.version }}.exe
            dist/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

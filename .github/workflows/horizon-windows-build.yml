name: HOR1ZON Windows Build

on:
  push:
    branches:
      - hor1zon-foundation
    paths:
      - 'HOR1ZON/**'
      - '.github/workflows/horizon-windows-build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: horizon-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: HOR1ZON
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: HOR1ZON/package.json

      - name: Install dependencies
        run: npm install

      - name: Syntax check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Package Windows artifacts
        run: npm run build:win

      - name: Verify package outputs
        shell: powershell
        run: |
          $version = node -p "require('./package.json').version"
          $nsis = "dist/Crimson-Atlas-Horizon-Setup-$version.exe"
          if (!(Test-Path $nsis)) { throw "Missing NSIS artifact: $nsis" }
          Get-ChildItem dist | Select-Object Name,Length

      - name: Prepare updater metadata
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "horizon-v$version"
          $nsis = "dist/Crimson-Atlas-Horizon-Setup-$version.exe"
          $sha512Bytes = [System.Security.Cryptography.SHA512]::Create().ComputeHash([System.IO.File]::ReadAllBytes($nsis))
          $sha512 = [Convert]::ToBase64String($sha512Bytes)
          $size = (Get-Item $nsis).Length
          $releaseDate = (Get-Date).ToUniversalTime().ToString("o")
          $latest = @"
          version: $version
          files:
            - url: https://github.com/imteerathan/Crimson-Age/releases/download/$tag/Crimson-Atlas-Horizon-Setup-$version.exe
              sha512: $sha512
              size: $size
          releaseDate: $releaseDate
          "@
          Set-Content -Path dist/latest.yml -Value $latest -Encoding utf8
          $releaseJson = gh release list --limit 100 --json tagName
          if ($LASTEXITCODE -ne 0) { throw "Unable to query GitHub releases." }
          $existingTag = @($releaseJson | ConvertFrom-Json | Where-Object { $_.tagName -eq $tag })
          if ($existingTag.Count -gt 0) {
            gh release upload $tag "$nsis#Crimson-Atlas-Horizon-Setup-$version.exe" "dist/latest.yml#latest.yml" --clobber --repo "${{ github.repository }}"
            if ($LASTEXITCODE -ne 0) { throw "Unable to upload release assets." }
          } else {
            gh release create $tag "$nsis#Crimson-Atlas-Horizon-Setup-$version.exe" "dist/latest.yml#latest.yml" --title "Crimson Atlas Horizon v$version" --notes "Horizon Extension $version" --target "${{ github.sha }}" --repo "${{ github.repository }}"
            if ($LASTEXITCODE -ne 0) { throw "Unable to create GitHub release." }
          }
          New-Item -ItemType Directory -Force -Path ../updates/stable | Out-Null
          Copy-Item dist/latest.yml ../updates/stable/latest.yml -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ../updates/stable/latest.yml
          if (git diff --cached --quiet) {
            Write-Host "Stable feed unchanged."
          } else {
            git commit -m "chore(horizon): publish stable updater feed v$version"
            git push origin HEAD:${{ github.ref_name }}
          }
      - name: Upload Horizon Installer
        uses: actions/upload-artifact@v4
        with:
          name: crimson-atlas-horizon-installer-${{ github.sha }}
          path: |
            HOR1ZON/dist/Crimson-Atlas-Horizon-Setup-*.exe
            HOR1ZON/dist/latest.yml
          if-no-files-found: error

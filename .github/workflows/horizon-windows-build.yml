name: HOR1ZON Windows Build

on:
  push:
    branches:
      - hor1zon-foundation
    paths:
      - 'HOR1ZON/**'
      - '.github/workflows/horizon-windows-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: HOR1ZON
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: HOR1ZON/package.json

      - name: Install dependencies
        run: npm install

      - name: Syntax check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Package Windows artifacts
        run: npm run build:win

      - name: Verify package outputs
        shell: powershell
        run: |
          $version = node -p "require('./package.json').version"
          $nsis = "dist/Crimson-Atlas-Horizon-Setup-$version.exe"
          if (!(Test-Path $nsis)) { throw "Missing NSIS artifact: $nsis" }
          Get-ChildItem dist | Select-Object Name,Length

      - name: Read package version
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Upload Horizon Installer
        uses: actions/upload-artifact@v4
        with:
          name: crimson-atlas-horizon-installer-${{ github.sha }}
          path: |
            HOR1ZON/dist/Crimson-Atlas-Horizon-Setup-${{ steps.version.outputs.version }}.exe
          if-no-files-found: error

      - name: Upload Horizon Installer
        uses: actions/upload-artifact@v4
        with:
          name: crimson-atlas-horizon-installer-${{ github.sha }}
          path: HOR1ZON/dist/Crimson-Atlas-Horizon-Setup-${{ steps.version.outputs.version }}.exe
          if-no-files-found: error
